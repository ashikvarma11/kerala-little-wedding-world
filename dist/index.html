<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#103e3e"><meta name="robots" content="noindex,nofollow"><title>Our little wedding world · Kerala</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./three.module.js"}}</script></head>
<body>
<main id="world" aria-label="Interactive Kerala wedding island"><div id="canvas"></div><div class="vignette"></div>
<header><div class="brand"><span class="monogram">♡</span><div><span class="eyebrow">A LITTLE WORLD, A BIG DAY</span><h1>Meet us in Kerala</h1></div></div><button id="details" class="pill">Invitation details <span>↗</span></button></header>
<div class="intro"><span class="eyebrow">YOU’RE INVITED</span><p>A little walk.<br>A lifetime together.</p><span class="intro-note">Three places. One celebration.</span></div>
<div id="labels" aria-label="Explore wedding locations"></div>
<div id="loading" role="status">Planting the palms…</div>
<div class="bottom"><div class="journey"><span class="eyebrow">YOUR LITTLE JOURNEY</span><div id="progress">○ &nbsp; ○ &nbsp; ○ <span>0 of 3 places discovered</span></div></div><button id="reset" class="icon-button" aria-label="Return to island entrance">⌂</button></div>
<div class="controls"><div id="joystick" aria-label="Drag to walk" role="group"><div class="cross">＋</div><div id="thumb"></div></div><div class="control-hint">Drag to wander<br><span>or tap a place</span></div><button id="interact" disabled>Walk to a place <span>✦</span></button></div>
<footer><span>KERALA, WITH LOVE</span><button id="credits">About this little world</button></footer>
</main>
<dialog id="panel" aria-labelledby="panel-title"><button id="close" class="close" aria-label="Close invitation details">×</button><div id="panel-content"></div></dialog>
<noscript><div class="nojs"><h2>You’re invited to Kerala</h2><p>Wedding date, couple’s names, ceremony schedule, venue and RSVP contact are still to be confirmed. This is a private invitation prototype.</p></div></noscript>
<script type="module" src="world.js"></script></body></html>
